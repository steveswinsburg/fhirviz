name: CI

permissions:
  contents: read

on:
  push:
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x, 24.x, 26.x]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm pack --dry-run

  publish:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
      # Trusted publishing requires npm >= 11.5.1 and a matching npm publisher configuration.
      # Configure this repository, workflow file (ci.yml), and master branch in npm package settings.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm test
      - name: Publish to npm
        run: |
          version="$(node -p "require('./package.json').version")"
          published="$(npm view "fhirviz-cli@${version}" version 2>/dev/null || true)"
          if [ "$published" = "$version" ]; then
            echo "fhirviz-cli@${version} is already on npm, skipping publish"
          else
            npm publish
          fi
      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="v$(node -p "require('./package.json').version")"
          if gh release view "$version" >/dev/null 2>&1; then
            echo "${version} already exists, skipping GitHub Release"
          else
            gh release create "$version" --generate-notes --target "$GITHUB_SHA"
          fi
